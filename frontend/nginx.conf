server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }

    # Fichiers d'assets nommes par hash de contenu (Vite) : mise en cache
    # longue duree sans risque, un changement de contenu change le nom du fichier.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html ne doit jamais etre mis en cache par le navigateur : sinon,
    # apres un nouveau deploiement, le navigateur peut continuer a servir un
    # index.html perime qui reference des fichiers assets/*.js|css qui
    # n'existent plus dans l'image reconstruite (404 silencieux -> page
    # rendue sans aucun style, comme du HTML/Bootstrap brut).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
